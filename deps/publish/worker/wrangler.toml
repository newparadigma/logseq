name = "logseq-publish"
main = "dist/worker/main.js"
compatibility_date = "2025-05-05"
compatibility_flags = ["nodejs_compat"]

# Workers Logs
# Docs: https://developers.cloudflare.com/workers/observability/logs/workers-logs/
# Configuration: https://developers.cloudflare.com/workers/observability/logs/workers-logs/#enable-workers-logs
[observability]
enabled = true

[[durable_objects.bindings]]
name = "PUBLISH_META_DO"
class_name = "PublishMetaDO"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PublishMetaDO"]

[[r2_buckets]]
binding = "PUBLISH_R2"
bucket_name = "logseq-publish-dev"

[vars]
AUTH_JWKS_URL = ""
AUTH_ISSUER = ""
AUTH_CLIENT_ID = ""

[env.staging]
name = "logseq-publish-staging"

[env.staging.vars]
AUTH_JWKS_URL = ""
AUTH_ISSUER   = ""
AUTH_CLIENT_ID = ""

[[env.staging.durable_objects.bindings]]
name = "PUBLISH_META_DO"
class_name = "PublishMetaDO"

[[env.staging.migrations]]
tag = "v2"
new_sqlite_classes = ["PublishMetaDO"]

[[env.staging.r2_buckets]]
binding = "PUBLISH_R2"
bucket_name = "logseq-publish-dev"

[env.prod]
name = "logseq-publish-prod"

[env.prod.vars]
AUTH_JWKS_URL = ""
AUTH_ISSUER   = ""
AUTH_CLIENT_ID = ""

[[env.prod.durable_objects.bindings]]
name = "PUBLISH_META_DO"
class_name = "PublishMetaDO"

[[env.prod.migrations]]
tag = "v2"
new_sqlite_classes = ["PublishMetaDO"]

[[env.prod.r2_buckets]]
binding = "PUBLISH_R2"
bucket_name = "logseq-publish-prod"

[[env.prod.routes]]
pattern = "logseq.io"
custom_domain = true
