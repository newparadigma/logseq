name = "logseq-sync"
main = "entry.mjs"
compatibility_date = "2026-07-11"
compatibility_flags = [ "nodejs_compat" ]

[[worker_loaders]]
binding = "LOADER"

[limits]
cpu_ms = 300000

[version_metadata]
binding = "CF_VERSION_METADATA"

[observability]
enabled = true

[observability.logs]
invocation_logs = false

[[durable_objects.bindings]]
name = "LOGSEQ_SYNC_DO"
class_name = "SyncDO"

[[r2_buckets]]
binding = "LOGSEQ_SYNC_ASSETS"
bucket_name = "logseq-sync-assets"

[[d1_databases]]
binding = "DB"
# Local development only (wrangler dev, migrate:local). The self-hosted
# server is the Node adapter (docker/db-sync); for a Cloudflare deploy set
# your own D1 database and R2 bucket here.
database_name = "logseq-sync-graph-meta"
database_id = "00000000-0000-0000-0000-000000000000"

[[migrations]]
tag = "v1"
new_sqlite_classes = [ "SyncDO" ]

[vars]
AUTH_JWKS_URL = ""
AUTH_ISSUER = ""
AUTH_CLIENT_ID = ""

[[ratelimits]]
name = "SEMANTIC_READ_RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 120
period = 60

[[ratelimits]]
name = "SEMANTIC_WRITE_RATE_LIMITER"
namespace_id = "1002"

[ratelimits.simple]
limit = 20
period = 60
